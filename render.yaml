services:
  - type: web
    name: eliteschool-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: TEACHER_LOGIN_CODE
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: MAX_VIDEO_SIZE_MB
        value: "5120"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: AI_API_KEY
        sync: false

staticSites:
  - name: eliteschool-web
    buildCommand: echo "static"
    staticPublishPath: public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
